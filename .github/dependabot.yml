version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      dotnet-runtime-packages:
        patterns:
          - "System.*"
          - "Microsoft.Bcl.*"
          - "Microsoft.Data.Sqlite.Core"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
